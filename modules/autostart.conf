# Autostart

exec-once = hyprpm reload
exec-once = uwsm-app -- hyprpaper
exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- vicinae server
#exec-once = uwsm-app -- hyprlauncher -d
exec-once = uwsm-app -- mako 
exec-once = uwsm-app -- ~/.config/hypr/waybar/start
exec-once = uwsm-app -- wl-paste -p --watch wl-copy -pc &
#exec-once = uwsm-app -- swww-daemon
exec-once = hyprctl hyprpaper wallpaper ",~/.local/share/bg"
#exec-once = source ~/.config/hypr/lib.sh && random-wallpaper &
exec-once = uwsm-app -- swayosd-server
#exec-once = systemctl --user start hyprpolkitagent &
exec-once = uwsm-app -- /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = uwsm-app -- dbus-update-activation-environment --systemd --all
exec-once = uwsm-app -- ~/.config/hypr/scripts/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
