autogenerated = 0

# DOCS: https://wiki.hyprland.org #

# Defaults
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/envs.conf
source = ~/.config/hypr/modules/input.conf
source = ~/.config/hypr/modules/windows.conf

# Customs
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/custom.conf

# Configure split-monitor-workspaces
exec = ~/.config/hypr/scripts/configure-split-monitor-workspaces.sh

$termnial = alacritty
$browser = zen-browser || floorp || firefox
$launcher = (vicinae toggle) || (hyprlauncher) || (killall bemenu-run || bemenu-run -l 20)

general {
  gaps_in=3
  gaps_out=9
  border_size=1
  gaps_workspaces=50
  col.active_border = rgb(0088FF)
  col.inactive_border = rgba(255,255,255,0.2)
  resize_on_border = true
  allow_tearing = true
  layout = master

  snap {
    enabled = true
  }
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(Alacritty)$
  vfr = true
  middle_click_paste = false
  focus_on_activate = true
}

decoration {
  rounding = 4

  active_opacity = 1.0
  inactive_opacity = 1.0

	blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        brightness = 0.8
        vibrancy_darkness = 1.0
	contrast = 1.0
    }
  shadow {
    enabled = true
  }


}

cursor {
  hide_on_key_press = true
}
layerrule = match:namespace gtk-layer-shell, blur on
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, blur_popups on
layerrule = match:namespace waybar, ignore_alpha 0.2

layerrule = match:namespace vicinae, blur on
layerrule = match:namespace vicinae, ignore_alpha 0
layerrule = match:namespace vicinae, no_anim on

layerrule {
    name = notifications
    match:namespace = notifications

    #ignore_zero = on # Removed?
    ignore_alpha = on
    animation = popin 80%
}


# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█
animations {
  enabled = false
  # █▄▄ █▀▀ ▀█ █ █▀▀ █▀█   █▀▀ █░█ █▀█ █░█ █▀▀
  # █▄█ ██▄ █▄ █ ██▄ █▀▄   █▄▄ █▄█ █▀▄ ▀▄▀ ██▄
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1

  animation = windows, 1, 5, overshot, popin
  animation = windowsOut, 1, 4, smoothOut, popin
  animation = windowsMove, 1, 4, default
  animation = border, 1, 10, default
  animation = fade, 1, 10, smoothIn
  animation = fadeDim, 1, 10, smoothIn
  animation = workspaces, 1, 6, default

}

# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

dwindle {
  #no_gaps_when_only = false
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█
# Common GTK dialogs/popups (progress, confirm, error, etc.) – float them
windowrule {
    name = gtk-dialogs-float
    match:class = (file_progress|confirm|dialog|download|notification|error|splash|confirmreset|file-roller|Lxappearance)

    float = on
}

# Specific title-based dialogs
windowrule {
    name = title-dialogs-float
    match:title = (Open File|branchdialog)

    float = on
}

# Image viewers
windowrule {
    name = image-viewers-float
    match:class = (viewnior|feh)

    float = on
}

# Audio controls (pavucontrol)
windowrule {
    name = pavucontrol-float
    match:class = (pavucontrol-qt|pavucontrol|org.pulseaudio.pavucontrol)
    match:title = ^(Volume Control)$

    float = on
    size = 800 600
    move = 75 44%   # Horizontal: 75px from left; Vertical: 44% from top
}

# Media viewer popups (e.g., Firefox/Chrome)
windowrule {
    name = media-viewer-float
    match:title = ^(Media viewer)$

    float = on
}

# Rofi (app launcher/menus) – float + no animations
windowrule {
    name = rofi
    match:class = Rofi

    float = on
    no_anim = on   # Disables all window animations (open/close/move/etc.)
}

# mpv – inhibit idle when focused
windowrule {
    name = mpv-idleinhibit
    match:class = mpv

    idle_inhibit = focus
}

# Firefox – inhibit idle when fullscreen (e.g., video playback)
windowrule {
    name = firefox-idleinhibit
    match:class = firefox

    idle_inhibit = fullscreen
}

# wlogout – fullscreen overlay (float + fullscreen for proper overlay behavior)
windowrule {
    name = wlogout
    match:class = wlogout
    match:title = wlogout

    float = on
    fullscreen = on
}

# VS Code
windowrule = opacity 0.9 0.9, match:class ^(code-oss)$
windowrule = no_blur on, match:class ^(code-oss)$
windowrule = opacity 0.9 0.9, match:class ^(Code)$
windowrule = no_blur on, match:class ^(Code)$

# Spotify
windowrule = float on, match:class ^(Spotify)$
windowrule = size 85% 85%, match:class ^(Spotify)$
windowrule = center on, match:class ^(Spotify)$
windowrule = opacity 0.9 0.8, match:class ^(Spotify)$
windowrule = workspace 5, match:class ^(Spotify)$
windowrule = no_blur on, match:class ^(Spotify)$

# Discord
windowrule = opacity 0.9 0.75, match:class ^(discord|vesktop)$

# Element
windowrule = opacity 0.9 0.8, match:class ^(Element)$
windowrule = no_blur on, match:class ^(Element)$

# Alacritty
windowrule = opacity 0.8 0.8, match:class ^(Alacritty)$

# Nemo
windowrule {
    name = file-manager
    match:class = (nemo)

    opacity = 0.7 0.7
    xray = on
    decorate = on
}

# Koodo
windowrule = opacity 0.8 0.75, match:class ^(koodo-reader)$

# Webcam window (assuming title contains "webcam" – adjust regex if needed for exact/partial match)
windowrule = float on, match:title [Ww]ebcam
windowrule = move 100%-340 100%-260, match:title [Ww]ebcam
windowrule = size 320 240, match:title [Ww]ebcam
windowrule = opacity 0.75, match:title [Ww]ebcam
windowrule = pin on, match:title [Ww]ebcam

# Arc Raiders tweaks (Steam app ID 1808500)
windowrule = fullscreen on, match:class ^(steam_app_1808500)$
windowrule = stay_focused on, match:class ^(steam_app_1808500)$

# hyprpolkitagent (polkit agent window – common to make it centered, semi-transparent popup)
# Note: you have duplicate size rules; I kept the last one (500x350) – remove/comment the other if unwanted
windowrule = float on, match:class ^(hyprpolkitagent)$
windowrule = center on, match:class ^(hyprpolkitagent)$
windowrule = opacity 0.5, match:class ^(hyprpolkitagent)$
windowrule = size 500 350, match:class ^(hyprpolkitagent)$
windowrule = rounding 20, match:class ^(hyprpolkitagent)$
windowrule = animation popin, match:class ^(hyprpolkitagent)$
# windowrule = stay_focused on, match:class ^(hyprpolkitagent)$   # uncomment if you really need forced focus

# Screen Tearing
windowrule = match:class ^(cs2)$, immediate on


plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 0
    }

    hyprexpo {
        columns = 3
        gap_size = 9
        bg_col = rgb(0088FF)
        workspace_method = workspace # [center/first] [workspace] e.g. first 1 or center m+1

	# Gestures from plugins seem to make Hyprland crash easily if you don't do the gestures properly
	# Issue: https://github.com/hyprwm/hyprland-plugins/issues/547
	#gesture_distance = 300 # how far is the "max" for the gesture
	#hyprexpo-gesture = 3, vertical, expo
    }

    hyprbars {
	enabled = false
	bar_color = rgba(25,25,25,0.4)
        bar_height = 20
        bar_blur = yes

	col.text = rgb(255,255,255)
	bar_title_enabled = true
	bar_text_size = 10
	bar_text_font = Sans
	bar_text_align = center
	
	bar_buttons_alignment = left
	bar_part_of_window = true
	bar_precedence_over_border = true
	bar_button_padding = 10
	bar_padding = 9
	
	icon_on_hover = true
	inactive_button_color = rgba(255,255,255,0.2)
        on_double_click = hyprctl dispatch fullscreen 1

	hyprbars-button = rgb(ff4040), 10, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eeee11), 10, , hyprctl dispatch fullscreen 1
    }

    csgo-vulkan-fix {
        # Whether to fix the mouse position. A select few apps might be wonky with this.
        fix_mouse = true

        # Add apps with vkfix-app = initialClass, width, height
        vkfix-app = cs2, 1584, 1080
    }



}

debug {
  #overlay = true
  error_position = 1
}

source = ~/.config/hypr/keybinds.conf
